name: Deploy Docs and Config Schema

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
      # pyaudio (via robopianist) compiles against portaudio.h.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Generate JSONSchema
        run: generate_schema
      # Submodules are passed explicitly because pdoc hides any not listed in a package's `__all__`.
      # src.audiotools is excluded until it imports cleanly.
      - name: Generate API docs
        run: |
          pdoc src $(find src -name '*.py' ! -name '__init__.py' ! -path 'src/audiotools/*') '!src\.audiotools' \
            --docformat google -o site
      # Keep the schema at the site root so its URL stays the same.
      - name: Add JSONSchema to site
        run: cp config/schemas/*.json site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
