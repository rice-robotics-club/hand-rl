# yaml-language-server: $schema=schemas/schema.json
runner:
  class_name: OnPolicyRunner
  run_name: piano
  save_interval: 100
  obs_groups:
    actor:
      [
        "position",
        "velocity",
        "orientation",
        "joint_positions",
        "pressed",
        "target_active",
        "target_remaining",
        "next_note_valid",
        "next_note_time",
        "next_note_duration",
        "note_correctness",
        "previous_action",
        "target_offsets",
      ]
    critic:
      [
        "position",
        "velocity",
        "orientation",
        "joint_positions",
        "pressed",
        "target_active",
        "target_remaining",
        "next_note_valid",
        "next_note_time",
        "next_note_duration",
        "note_correctness",
        "previous_action",
        "target_offsets",
      ]
  num_steps_per_env: 24
  algorithm:
    class_name: PPO
    # The adaptive schedule pinned the rate at its 1e-5 floor from the first update.
    schedule: fixed
    learning_rate: 0.0003
  actor:
    class_name: MLPModel
    obs_normalization: true
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.5 # Gentler initial exploration than 1.0; smoother early motion.
  critic:
    class_name: MLPModel
    obs_normalization: true
env:
  class_name: src.env.hand_piano:HandPianoEnv
  notes_path: data/right_hand/expected.notes.json
  max_episode_length: null # Derive from the score plus preparation/release time.
  lead_in_seconds: 0.5
  release_tail_seconds: 0.5
  pressed_threshold: 0.5
  nearness_scale: 0.1 # 0.90 at 1 cm, 0.54 at 5 cm, 0.24 at 10 cm, 0.01 at 25 cm.
  # The key under each finger, thumb to pinky, for finger_nearness. note_nearness
  # credits any free finger.
  finger_pitches: [60, 62, 64, 65, 67]
  # In the viewer, color environment 0's keys: blue = wanted, green = wanted and down, red = wrong.
  color_correctness: true
  # Curriculum: weights move from reward_weights to final_reward_weights as the running
  # average of note recall rises from curriculum_start to curriculum_end.
  curriculum_start: 0.1
  curriculum_end: 0.7
  curriculum_rate: 0.2
  reward_weights:
    correct_notes: 1.0
    missed_notes: 1.0
    extra_notes: 0.2 # Low so exploring near the keys is affordable at first.
    note_nearness: 1.0 # Any free fingertip near each requested key.
    finger_nearness: 0.0 # The planned fingertip near each requested key.
    key_intensity: 0.0 # Tune target_hit_velocity from real hit_velocity values first.
    wrong_keys: 0.0
    action_rate: 0.5 # Penalizes jerk: mean squared change between actions.
    finger_posture: 0.2 # Stay near the pianist posture (curved fingers).
    hand_orientation: 0.2 # Keep the hand level, palm down.
  final_reward_weights:
    correct_notes: 1.0
    missed_notes: 1.0
    extra_notes: 1.0
    note_nearness: 0.2
    finger_nearness: 1.0
    key_intensity: 0.0
    wrong_keys: 0.5
    action_rate: 0.5
    finger_posture: 0.2
    hand_orientation: 0.2
system:
  class_name: src.sim.hand_piano:HandPiano
  num_envs: 1536
  genesis:
    sim_options:
      dt: 0.016666666666666666
      substeps: 4 # 2 let fingertips sink twice as deep into the keys.
    show_viewer: false
    viewer_options:
      enable_gui: true
      # GUI plugins compile kernels on the viewer's thread, which Genesis only allows on
      # the main thread, so the viewer can't run in a background thread.
      run_in_thread: false
  action_smoothing: 0.25 # Moving average of actions; settles in about 4 steps (65 ms).
  base_action_scale: [0.1, 0.3] # Base reach from the default pose: meters, radians.
  base_force_limit: [10.0, 2.0] # Newtons, newton-meters; keeps the base from crushing keys.
  piano:
    class_name: src.sim.piano:Piano
    color_pressed: true # Superseded by env.color_correctness while that is on.
    audio: false # Play key presses out loud in real time; `evaluate --audio` turns this on.
