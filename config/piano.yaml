# yaml-language-server: $schema=schemas/schema.json
runner:
  class_name: OnPolicyRunner
  run_name: piano
  save_interval: 100
  obs_groups:
    actor:
      [
        "position",
        "velocity",
        "orientation",
        "joint_positions",
        "pressed",
        "target_active",
        "target_remaining",
        "next_note_valid",
        "next_note_time",
        "next_note_duration",
        "note_correctness",
      ]
    critic:
      [
        "position",
        "velocity",
        "orientation",
        "joint_positions",
        "pressed",
        "target_active",
        "target_remaining",
        "next_note_valid",
        "next_note_time",
        "next_note_duration",
        "note_correctness",
      ]
  num_steps_per_env: 24
  algorithm:
    class_name: PPO
  actor:
    class_name: MLPModel
    obs_normalization: true
    distribution_cfg:
      class_name: GaussianDistribution
  critic:
    class_name: MLPModel
    obs_normalization: true
env:
  class_name: src.env.hand_piano:HandPianoEnv
  notes_path: samples/right_hand/expected.notes.json
  max_episode_length: null # Derive from the score plus preparation/release time.
  lead_in_seconds: 0.5
  release_tail_seconds: 0.5
  pressed_threshold: 0.5
  nearness_scale: 0.02
  reward_weights:
    correct_notes: 1.0
    missed_notes: 1.0
    extra_notes: 1.0
    note_nearness: 0.0 # Requires measured fingertip_key_distances in system state.
system:
  class_name: src.sim.hand_piano:HandPiano
  num_envs: 100
  genesis:
    sim_options:
      dt: 0.016666666666666666
      substeps: 2
    show_viewer: false
    viewer_options:
      enable_gui: true
      # GUI plugins compile kernels on the viewer's thread, which Genesis only allows on
      # the main thread, so the viewer can't run in a background thread.
      run_in_thread: false
  piano:
    class_name: src.sim.piano:Piano
    color_pressed: true
