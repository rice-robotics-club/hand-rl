[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-rl"
version = "0.1.0"
description = "Rice Robotics Hand Command"
readme = "README.md"
authors = [
  { name = "Clay Goldsmith", email = "cg156@rice.edu" },
  { name = "Isabella Alvarez", email = "ia33@rice.edu" },
  { name = "Marianna Argeiti", email = "ma312@rice.edu" },
  { name = "Emily Zheng", email = "ez58@rice.edu" },
  { name = "Dany Yao", email = "dy62@rice.edu" },
  { name = "Tristan Burchett", email = "tb85@rice.edu" },
  { name = "Justin Lopato", email = "justin@lopa.to" },
]
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "pyyaml",
  "tensorboard>=2.20.0",
  "jsonschema",
  "jsonschema-gentypes",
  "tensordict",
  "pygame",
  "genesis-world[render] @ git+https://github.com/Genesis-Embodied-AI/Genesis.git",
  "rsl-rl-lib==5.*",
  "cowsay>=6.1",
  "lolcat>=1.4",
  "pretty_midi>=0.2.11,<0.3",
  "jaxtyping>=0.3.11",
  "beartype>=0.22.9",
  "pydantic>=2.13.5",
  "robopianist",
]

[tool.uv.sources]
robopianist = { path = "robots/robopianist", editable = true }

[project.scripts]
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
scene = "scripts.scene:main"
generate_schema = "scripts.generate_schema:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "src*", "robots*"]

[tool.setuptools.package-data]
config = ["*.yaml", "schemas/*.json"]

[project.optional-dependencies]
sheet = ["music21>=9.1,<10"]

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "docformatter>=1.7.8",
  "pdoc>=16.0.0",
  "ruff>=0.16.8",
]

[tool.uv]
override-dependencies = ["scikit-learn>=1.5", "labmaze; python_version < '0'"]

[tool.ruff]
# Ruff's default rule set changes between versions; pin it so everyone gets the same.
required-version = ">=0.16,<0.17"
target-version = "py312"
line-length = 88
extend-exclude = ["robots", "third_party", "logs", "savedlogs"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["robots/robopianist"]
include = ["src", "scripts", "tests"]
exclude = [
  "robots",
  "third_party",
  "logs",
  "**/.*",
  "**/__pycache__",
  "**/node_modules",
  "*.egg-info",
]
# "standard" checks types; on top of it, require annotations on parameters, since
# explicit types are how we plan and read interfaces.
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportImplicitOverride = "error"

# Untyped third-party libraries (genesis, rsl_rl, etc.) would otherwise flood these.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
