[build-system]
requires=["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-rl"
version = "0.1.0"
description = "Rice Robotics Hand Command"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "pyyaml",
  "tensorboard>=2.20.0",
  "jsonschema",
  "jsonschema-gentypes",
  "tensordict",
  "pygame",
  "genesis-world[render] @ git+https://github.com/Genesis-Embodied-AI/Genesis.git",
  "rsl-rl-lib==5.*",
  "cowsay>=6.1",
  "lolcat>=1.4",
  "pretty_midi>=0.2.11,<0.3",
  "jaxtyping>=0.3.11",
  "beartype>=0.22.9",
  "pydantic>=2.13.5",
  "robopianist",
]

[tool.uv.sources]
robopianist = { path = "robots/robopianist", editable = true }

[project.scripts]
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
generate_schema = "scripts.generate_schema:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "src*", "robots*"]

[tool.setuptools.package-data]
config = ["*.yaml", "schemas/*.json"]

[project.optional-dependencies]
sheet = [
  "music21>=9.1,<10",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "docformatter>=1.7.8",
  "pdoc>=16.0.0",
  "ruff>=0.16.8",
]

[tool.uv]
override-dependencies = ["scikit-learn>=1.5", "labmaze; python_version < '0'"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["robots/robopianist"]
exclude = ["robots", "third_party", ".venv"]

# Silence diagnostics caused by untyped third-party libraries (genesis, rsl_rl, etc.)
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
